name: Flutter CI

on:
  push:
    branches: [taufik]
  pull_request:
    branches: [taufik]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Setup Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true # Cache Flutter SDK untuk build lebih cepat

      # 3. Verify Flutter installation
      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 4. Install dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 5. Run code generation (jika pakai build_runner)
      - name: Generate Code (Build Runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs
        continue-on-error: true # Skip jika tidak ada code generation

      # 6. Analyze code quality
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true # Warning tidak gagalkan CI

      # 7. Run unit tests dengan coverage
      - name: Run Unit Tests
        run: |
          flutter test test/unit/ \
            --coverage \
            --reporter expanded \
            --test-randomize-ordering-seed random

      # 8. Upload coverage ke Codecov (optional)
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      # 9. Generate coverage report summary
      - name: Coverage Report Summary
        run: |
          echo "📊 Test Coverage Summary:"
          if [ -f coverage/lcov.info ]; then
            lines=$(grep -o "LF:[0-9]*" coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
            covered=$(grep -o "LH:[0-9]*" coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
            if [ "$lines" -gt 0 ]; then
              coverage=$(awk "BEGIN {printf \"%.2f\", ($covered/$lines)*100}")
              echo "✅ Coverage: $coverage% ($covered/$lines lines)"
            fi
          else
            echo "⚠️ No coverage data found"
          fi
        continue-on-error: true

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test # Run setelah test sukses

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
